{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMO Portal — Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, #0a0f1a 45%, #050810 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .pmo-card {
      width: min(420px, 100%);
      border-radius: 18px;
      background: linear-gradient(165deg, rgba(30,41,59,0.95), rgba(15,23,42,0.98));
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      padding: 28px 26px 26px;
      text-align: left;
    }
    .pmo-title {
      text-align: left;
      font-weight: 800;
      letter-spacing: 0.06em;
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 18px;
    }
    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }
    .role-btn {
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(15,23,42,0.6);
      color: #cbd5e1;
      padding: 12px 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .role-btn:hover { transform: translateY(-1px); border-color: rgba(56,189,248,0.45); }
    .role-btn.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.55);
      color: #f8fafc;
    }
    .role-btn .crown { color: #fbbf24; }
    .access-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .form-control {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .form-control:focus {
      border-color: rgba(56,189,248,0.55);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
      background: #0f172a;
      color: #f8fafc;
    }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 8px; }
    .password-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding-left: 0;
    }
    .password-toggle .form-check-input {
      float: none;
      margin: 1px 0 0;
    }
    .password-toggle .form-check-label {
      font-size: 12px;
      line-height: 1;
      color: #94a3b8;
      margin: 0;
    }
    .btn-portal {
      width: 100%;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
    }
    .btn-portal:hover { filter: brightness(1.06); color: #fff; }
    .alert { font-size: 13px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="pmo-card">
    <div class="pmo-title">PMO COMMAND — Sign in</div>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger py-2">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post" action="">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next_url|default:'/' }}">
      <div class="role-toggle" role="group" aria-label="Role">
        <button type="button" class="role-btn active" data-role="team" id="btnTeam" title="Team member access">
          <i class="bi bi-person-fill fs-5" aria-hidden="true"></i>
          <span>Team member</span>
        </button>
        <button type="button" class="role-btn" data-role="manager" id="btnManager" title="Manager access">
          <i class="bi bi-gem crown fs-5" aria-hidden="true"></i>
          <span>Manager</span>
        </button>
      </div>
      <input type="hidden" name="role" id="roleInput" value="team">

      <div class="access-label">Access password</div>
      <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter password…" required autocomplete="current-password">
      <div class="form-check password-toggle">
        <input class="form-check-input" type="checkbox" value="" id="showPasswordCheck">
        <label class="form-check-label" for="showPasswordCheck">Show password</label>
      </div>

      <button type="submit" class="btn btn-portal" id="btnPortalSubmit">Enter Portal →</button>
    </form>
  </div>
  <script>
    (function() {
      var teamBtn = document.getElementById("btnTeam");
      var mgrBtn = document.getElementById("btnManager");
      var roleInput = document.getElementById("roleInput");
      var passwordInput = document.getElementById("passwordInput");
      var showPasswordCheck = document.getElementById("showPasswordCheck");
      var submitBtn = document.getElementById("btnPortalSubmit");
      function setRole(r) {
        roleInput.value = r;
        teamBtn.classList.toggle("active", r === "team");
        mgrBtn.classList.toggle("active", r === "manager");
        if (submitBtn) {
          submitBtn.textContent = r === "manager" ? "Enter As Manager" : "Enter Portal →";
        }
      }
      teamBtn.addEventListener("click", function() { setRole("team"); });
      mgrBtn.addEventListener("click", function() { setRole("manager"); });
      showPasswordCheck.addEventListener("change", function() {
        passwordInput.type = showPasswordCheck.checked ? "text" : "password";
      });
    })();
  </script>
</body>
</html>
