{# Project detail — tasks table (Cards View) #}
<style>
  #{{ prefix }}-detail-view { display: none; }
  #{{ prefix }}-detail-view.pr-detail-visible { display: block; animation: {{ prefix }}FadeUp 0.4s ease both; }
  #{{ prefix }}-cards-embed .pr-back-btn {
    display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid var(--pr-border);
    background: #fff; border-radius: 8px; padding: 0.4rem 0.85rem; font-size: 0.85rem;
    font-weight: 600; color: var(--pr-muted); cursor: pointer; margin-bottom: 1rem;
  }
  #{{ prefix }}-cards-embed .pr-back-btn:hover { background: #f1f5f9; color: var(--pr-text); }
  #{{ prefix }}-cards-embed .pr-detail-desc {
    color: var(--pr-muted); font-size: 0.88rem; line-height: 1.55; margin: 0; padding: 10px 16px 12px;
    border-bottom: 1px solid var(--pr-border); background: #fafbfc;
  }
  #{{ prefix }}-cards-embed .pr-detail-reg-card {
    border: 1px solid var(--pr-border); border-radius: 14px; overflow: hidden; margin-bottom: 1rem;
    background: #fff;
  }
  #{{ prefix }}-cards-embed .pr-detail-reg-header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 0.75rem; padding: 12px 16px; border-bottom: 1px solid var(--pr-border); background: #f8fafc;
  }
  #{{ prefix }}-cards-embed .pr-detail-reg-title {
    font-size: 0.95rem; font-weight: 800; margin: 0; letter-spacing: 0.04em; text-transform: uppercase;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
  }
  #{{ prefix }}-cards-embed .pr-detail-reg-pill {
    display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 700;
    padding: 0.25rem 0.65rem; border-radius: 999px; background: #e0f2fe; color: #0369a1;
    border: 1px solid #bae6fd; text-transform: none; letter-spacing: 0;
  }
  #{{ prefix }}-cards-embed .pr-detail-task-count {
    font-size: 0.72rem; font-weight: 600; color: var(--pr-muted); text-transform: none; letter-spacing: 0;
  }
  #{{ prefix }}-cards-embed .pr-detail-reg-wrap {
    overflow: auto; max-height: min(420px, 50vh); margin: 0; border: 0; border-radius: 0;
  }
  #{{ prefix }}-cards-embed .pr-panel {
    background: #fff; border: 1px solid var(--pr-border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  }
  #{{ prefix }}-cards-embed .pr-panel-title { font-size: 1rem; font-weight: 700; margin: 0 0 1rem; }
  #{{ prefix }}-cards-embed .pr-task-header-actions {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 0.65rem;
  }
  #{{ prefix }}-cards-embed .pr-task-filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
  }
  #{{ prefix }}-cards-embed .pr-task-filter-group {
    display: inline-flex; align-items: center; gap: 0.35rem;
  }
  #{{ prefix }}-cards-embed .pr-task-filter-group label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--pr-muted); margin: 0; white-space: nowrap;
  }
  #{{ prefix }}-cards-embed .pr-task-filter-group select {
    border: 1px solid var(--pr-border); border-radius: 8px; padding: 0.35rem 1.75rem 0.35rem 0.55rem;
    font-size: 0.8rem; font-weight: 600; color: var(--pr-text); background: #fff;
    min-width: 8.5rem; cursor: pointer;
  }
  #{{ prefix }}-cards-embed .pr-task-filter-hint {
    width: 100%; font-size: 0.72rem; color: var(--pr-muted); font-weight: 600;
    padding: 0 16px 8px; border-bottom: 1px solid var(--pr-border); background: #fafbfc;
  }
  #{{ prefix }}-cards-embed .pr-add-task-btn {
    border: none; background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff;
    border-radius: 10px; padding: 0.45rem 0.95rem; font-size: 0.82rem; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
  }
  #{{ prefix }}-cards-embed .pr-edit-project-btn {
    border: 1px solid var(--pr-border); background: #fff; color: var(--pr-text);
    border-radius: 10px; padding: 0.45rem 0.95rem; font-size: 0.82rem; font-weight: 700; cursor: pointer;
  }
  #{{ prefix }}-cards-embed .pr-edit-project-btn:hover { background: #f1f5f9; }
  #{{ prefix }}-cards-embed .pr-detail-header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  #{{ prefix }}-cards-embed .pr-phase-row { margin-bottom: 1rem; }
  #{{ prefix }}-cards-embed .pr-phase-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.35rem; }
  #{{ prefix }}-cards-embed .pr-phase-name { font-weight: 600; }
  #{{ prefix }}-cards-embed .pr-phase-stats { color: var(--pr-muted); font-size: 0.8rem; }
  #{{ prefix }}-cards-embed .pr-phase-bar { height: 8px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
  #{{ prefix }}-cards-embed .pr-phase-bar-fill { height: 100%; border-radius: 999px; }
  #{{ prefix }}-cards-embed .pr-phase-bar-fill.complete { background: var(--pr-green); }
  #{{ prefix }}-cards-embed .pr-phase-bar-fill.partial { background: var(--pr-blue); }
  #{{ prefix }}-cards-embed .pr-task-name { font-weight: 800; font-size: 13px; color: var(--pr-text); line-height: 1.25; }
  #{{ prefix }}-cards-embed .pr-task-sub { margin-top: 4px; font-size: 11px; color: var(--pr-muted); }
  #{{ prefix }}-cards-embed .pr-task-table-actions { display: flex; gap: 0.3rem; justify-content: flex-end; }
  #{{ prefix }}-cards-embed .pr-task-act-btn {
    border: 1px solid var(--pr-border); background: #fff; border-radius: 6px;
    width: 28px; height: 28px; font-size: 0.78rem; cursor: pointer;
  }
  #{{ prefix }}-cards-embed .pr-task-act-btn:hover { background: #f1f5f9; }
  #{{ prefix }}-cards-embed .pr-task-row-clickable { cursor: pointer; }
  #{{ prefix }}-cards-embed .pr-task-row-clickable:hover td { background: rgba(2, 132, 199, 0.06) !important; }
  #{{ prefix }}-cards-embed .pr-task-status-pill {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
    padding: 4px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  #{{ prefix }}-cards-embed .pr-empty-msg { color: var(--pr-muted); text-align: center; padding: 1.5rem; font-size: 0.9rem; }
  #{{ prefix }}-cards-embed .pr-kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 0.75rem; margin-bottom: 1rem;
  }
  #{{ prefix }}-cards-embed .pr-kpi-card {
    background: #f1f5f9; border-radius: 10px; padding: 0.85rem; text-align: center;
    border: 1px solid var(--pr-border);
  }
  #{{ prefix }}-cards-embed .pr-kpi-value { font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
  #{{ prefix }}-cards-embed .pr-kpi-label { font-size: 0.72rem; color: var(--pr-muted); font-weight: 600; margin-top: 0.25rem; }
  #{{ prefix }}-cards-embed .pr-kpi-value.red { color: var(--pr-red); }
  #{{ prefix }}-cards-embed .pr-kpi-value.yellow { color: var(--pr-yellow); }
  #{{ prefix }}-cards-embed .pr-kpi-value.orange { color: #ea580c; }
  #{{ prefix }}-cards-embed .pr-kpi-value.green { color: var(--pr-green); }
  #{{ prefix }}-cards-embed .pr-kpi-value.blue { color: var(--pr-blue); }
  #{{ prefix }}-cards-embed .pr-progress-panel {
    background: #fff; border: 1px solid var(--pr-border); border-radius: 12px;
    padding: 1.25rem; display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; margin-bottom: 1rem;
  }
  #{{ prefix }}-cards-embed .pr-progress-gauge-wrap .pr-gauge { width: 100px; height: 100px; position: relative; flex-shrink: 0; }
  #{{ prefix }}-cards-embed .pr-progress-gauge-wrap .pr-gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #{{ prefix }}-cards-embed .pr-progress-gauge-wrap .pr-gauge-bg { fill: none; stroke: #e2e8f0; stroke-width: 6; }
  #{{ prefix }}-cards-embed .pr-progress-gauge-wrap .pr-gauge-fill {
    fill: none; stroke-width: 6; stroke-linecap: round;
    transition: stroke-dashoffset 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #{{ prefix }}-cards-embed .pr-progress-gauge-wrap .pr-gauge-text {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 0.95rem; font-weight: 800; line-height: 1.2;
  }
  #{{ prefix }}-cards-embed .pr-gauge-sub { font-size: 0.6rem; color: var(--pr-muted); font-weight: 600; }
  #{{ prefix }}-cards-embed .pr-task-breakdown { flex: 1; min-width: 200px; }
  #{{ prefix }}-cards-embed .pr-task-legend { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.5rem; }
  #{{ prefix }}-cards-embed .pr-task-legend .done { color: var(--pr-green); }
  #{{ prefix }}-cards-embed .pr-task-legend .ip { color: var(--pr-blue); }
  #{{ prefix }}-cards-embed .pr-task-legend .pend { color: var(--pr-muted); }
  #{{ prefix }}-cards-embed .pr-stacked-bar { height: 10px; border-radius: 999px; background: #e2e8f0; overflow: hidden; display: flex; }
  #{{ prefix }}-cards-embed .pr-stacked-bar .seg-done, #{{ prefix }}-cards-embed .pr-stacked-bar .seg-ip { height: 100%; transition: width 0.8s ease; }
  #{{ prefix }}-cards-embed .pr-stacked-bar .seg-done { background: var(--pr-green); }
  #{{ prefix }}-cards-embed .pr-stacked-bar .seg-ip { background: var(--pr-blue); }
  #{{ prefix }}-cards-embed .pr-stacked-caption { font-size: 0.78rem; color: var(--pr-muted); margin-top: 0.4rem; }
  #{{ prefix }}-cards-embed .pr-automation-meta {
    padding: 0.75rem 1.25rem 1rem;
    border-top: 1px solid #e2e8f0;
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--pr-muted);
  }
  #{{ prefix }}-cards-embed .pr-automation-meta strong { color: #334155; font-weight: 700; }
</style>

<div id="{{ prefix }}-detail-view">
  <button type="button" class="pr-back-btn" id="{{ prefix }}-back-btn">← Back to Cards</button>

  <div class="pr-detail-reg-card">
    <div class="pr-detail-reg-header">
      <h3 class="pr-detail-reg-title">
        <span>Project Details</span>
        <span class="pr-detail-reg-pill" id="{{ prefix }}-d-project-name">—</span>
        <span class="pr-detail-task-count" id="{{ prefix }}-d-task-count">0 tasks</span>
      </h3>
      <div class="pr-detail-header-actions">
        <button type="button" class="pr-edit-project-btn" id="{{ prefix }}-edit-project-btn">Edit Project</button>
      </div>
    </div>
    <p class="pr-detail-desc" id="{{ prefix }}-d-desc" style="border-bottom:none;"></p>
    <div class="pr-automation-meta" id="{{ prefix }}-d-automation-meta" style="display:none;">
      <div><strong>Business Benefits:</strong> <span id="{{ prefix }}-d-business-benefits">—</span></div>
    </div>
  </div>

  <div class="pr-kpi-row" id="{{ prefix }}-d-kpis"></div>

  <div class="pr-progress-panel">
    <div class="pr-progress-gauge-wrap">
      <div class="pr-gauge" id="{{ prefix }}-d-gauge">
        <svg viewBox="0 0 36 36">
          <circle class="pr-gauge-bg" cx="18" cy="18" r="15.5"></circle>
          <circle class="pr-gauge-fill" cx="18" cy="18" r="15.5" stroke-dasharray="97.4" stroke-dashoffset="97.4"></circle>
        </svg>
        <div class="pr-gauge-text">
          <span id="{{ prefix }}-d-gauge-pct"></span>
          <span class="pr-gauge-sub">COMPLETE</span>
        </div>
      </div>
    </div>
    <div class="pr-task-breakdown">
      <div class="pr-task-legend" id="{{ prefix }}-d-legend"></div>
      <div class="pr-stacked-bar" id="{{ prefix }}-d-stacked"></div>
      <div class="pr-stacked-caption" id="{{ prefix }}-d-stacked-caption"></div>
    </div>
  </div>

  <div class="pr-detail-reg-card">
    <div class="pr-detail-reg-header">
      <h3 class="pr-detail-reg-title"><span>Tasks</span></h3>
      <div class="pr-task-header-actions">
        <div class="pr-task-filters">
          <div class="pr-task-filter-group">
            <label for="{{ prefix }}-filter-assignee">Assigned To</label>
            <select id="{{ prefix }}-filter-assignee" aria-label="Filter tasks by assignee">
              <option value="all">All</option>
            </select>
          </div>
        </div>
        <button type="button" class="pr-add-task-btn" id="{{ prefix }}-add-task-btn">+ Add Task</button>
      </div>
    </div>
    <div class="pr-task-filter-hint" id="{{ prefix }}-task-filter-hint" style="display:none;"></div>
    <div class="tw-reg-table-wrap pr-detail-reg-wrap">
      <table class="pp-table tw-reg-table">
        <thead>
          <tr>
            <th style="min-width:220px;">Description</th>
            <th style="min-width:110px;">Status</th>
            <th style="min-width:120px;">Deadline</th>
            <th style="min-width:120px;">Assigned To</th>
            <th style="min-width:80px;">Actions</th>
          </tr>
        </thead>
        <tbody id="{{ prefix }}-d-table-body"></tbody>
      </table>
    </div>
  </div>

</div>

{% with projects_data_id=prefix|add:"-projects-data" %}
{{ projects_tab.projects|json_script:projects_data_id }}
{% endwith %}

<script>
(function () {
  var PREFIX = "{{ prefix }}";
  var root = document.getElementById(PREFIX + "-cards-embed");
  if (!root) return;

  var dataEl = document.getElementById(PREFIX + "-projects-data");
  var projectsList = dataEl ? JSON.parse(dataEl.textContent) : [];
  var projectsMap = {};
  projectsList.forEach(function (p) { if (p && p.id) projectsMap[p.id] = p; });

  var registerWrap = document.getElementById(PREFIX + "-register-wrap");
  var detailView = document.getElementById(PREFIX + "-detail-view");
  var SAVE_URL = "{% url 'dashboard:projects_tab_save_tasks' %}";
  var SAVE_TASK_URL = "{% url 'dashboard:project_portfolio_save_task' %}";
  var UPDATE_PROJECT_URL = "{% url 'dashboard:projects_tab_update_project' %}";
  var IS_MANAGER = typeof window.__PMO_IS_MANAGER !== "undefined" && window.__PMO_IS_MANAGER;
  var CIRC = 97.4;
  var COLORS = { automation: "#2563eb", operations: "#16a34a", digital: "#7c3aed", red: "#dc2626", green: "#16a34a", blue: "#2563eb", gray: "#94a3b8" };
  var DEFAULT_PHASES = [
    "PHASE 1 — REQUIREMENTS & DESIGN",
    "PHASE 2 — DEVELOPMENT",
    "PHASE 3 — TESTING & UAT",
    "PHASE 4 — GO LIVE",
  ];

  var currentProjectId = null;
  var currentTasks = [];
  var editingTaskId = null;
  var taskFilterAssignee = "all";
  var TASK_ASSIGNEE_UNASSIGNED = "__unassigned__";

  function escHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function getCsrf() {
    var el = document.querySelector("[name=csrfmiddlewaretoken]");
    return el ? el.value : "";
  }

  function taskStatusMeta(status) {
    if (status === "done") return { cls: "tw-st-ontrack", label: "COMPLETED" };
    if (status === "in_progress") return { cls: "tw-st-approved", label: "IN PROGRESS" };
    return { cls: "tw-st-none", label: "NOT STARTED" };
  }

  function phaseBadgeClass(phase) {
    var ph = (phase || "").toLowerCase();
    if (ph.indexOf("1") >= 0 || ph.indexOf("req") >= 0 || ph.indexOf("scop") >= 0) return "tw-pmbok-init";
    if (ph.indexOf("2") >= 0 || ph.indexOf("dev") >= 0) return "tw-pmbok-exec";
    if (ph.indexOf("3") >= 0 || ph.indexOf("test") >= 0 || ph.indexOf("uat") >= 0) return "tw-pmbok-mon";
    if (ph.indexOf("4") >= 0 || ph.indexOf("live") >= 0 || ph.indexOf("go") >= 0) return "tw-pmbok-close";
    return "tw-pmbok-plan";
  }

  function cloneTasks(tasks) {
    return JSON.parse(JSON.stringify(tasks || []));
  }

  function flattenTasks(groups) {
    var flat = [];
    (groups || []).forEach(function (grp) {
      (grp.items || []).forEach(function (item) {
        flat.push({
          id: item.id,
          text: item.text,
          status: item.status || "pending",
          assignee: item.assignee || "",
          deadline: item.deadline || "",
          deadline_display: item.deadline_display || item.deadline || "",
          business_benefits: item.business_benefits || "",
          phase: grp.phase || "",
        });
      });
    });
    return flat;
  }

  function groupTasks(flat) {
    var map = {};
    var order = [];
    flat.forEach(function (t) {
      var ph = t.phase || "GENERAL";
      if (!map[ph]) {
        map[ph] = [];
        order.push(ph);
      }
      map[ph].push({
        id: t.id,
        text: t.text,
        status: t.status,
        assignee: t.assignee,
        deadline: t.deadline || "",
        deadline_display: t.deadline_display || t.deadline || "",
        business_benefits: t.business_benefits || "",
      });
    });
    return order.map(function (ph) {
      return { phase: ph, items: map[ph] };
    });
  }

  function progressColor(pct, cat) {
    if (pct >= 100) return COLORS.green;
    if (pct === 0) return COLORS.gray;
    if (pct < 40) return COLORS.red;
    return COLORS[cat] || COLORS.blue;
  }

  function pmoClass(score) {
    if (score < 30) return "red";
    if (score < 60) return "yellow";
    if (score >= 90) return "green";
    return "blue";
  }

  function spiCpiClass(val) {
    if (val >= 1) return "green";
    if (val > 0) return "orange";
    return "red";
  }

  function setGauge(el, pct, color) {
    if (!el) return;
    var fill = el.querySelector(".pr-gauge-fill");
    if (!fill) return;
    fill.style.stroke = color;
    fill.style.strokeDashoffset = String(CIRC);
    requestAnimationFrame(function () {
      fill.style.strokeDashoffset = String(CIRC - (CIRC * pct / 100));
    });
  }

  function taskCounts(tasks) {
    var flat = flattenTasks(tasks);
    return {
      total: flat.length,
      done: flat.filter(function (t) { return t.status === "done"; }).length,
      in_progress: flat.filter(function (t) { return t.status === "in_progress"; }).length,
      pending: flat.filter(function (t) { return t.status !== "done" && t.status !== "in_progress"; }).length,
    };
  }

  function computeMetricsFromTasks(c) {
    if (!c.total) {
      return { progress: 0, pmo_score: 0, spi: 0, cpi: 0 };
    }
    return {
      progress: Math.round((c.done / c.total) * 100),
      pmo_score: Math.round((c.done * 100 + c.in_progress * 50) / c.total),
      spi: Math.round((c.done / c.total) * 100) / 100,
      cpi: Math.round(((c.done + 0.5 * c.in_progress) / c.total) * 100) / 100,
    };
  }

  function formatSpiCpi(val) {
    if (val === null || val === undefined) return "0.00";
    return Number(val).toFixed(2);
  }

  function renderKpis(p) {
    var el = document.getElementById(PREFIX + "-d-kpis");
    if (!el) return;
    var c = taskCounts(currentTasks);
    var m = computeMetricsFromTasks(c);
    var kpis = [
      { label: "Overall Progress", value: m.progress + "%", cls: m.progress < 40 ? "red" : (m.progress >= 90 ? "green" : "blue") },
      { label: "PMO Health Score", value: m.pmo_score + "%", cls: pmoClass(m.pmo_score) },
      { label: "SPI", value: formatSpiCpi(m.spi), cls: spiCpiClass(m.spi) },
      { label: "CPI", value: formatSpiCpi(m.cpi), cls: spiCpiClass(m.cpi) },
      { label: "Tasks Done", value: c.done + "/" + c.total, cls: "green" },
      { label: "In Progress", value: String(c.in_progress), cls: "blue" },
    ];
    el.innerHTML = kpis.map(function (k) {
      return (
        '<div class="pr-kpi-card">' +
          '<div class="pr-kpi-value ' + k.cls + '">' + escHtml(k.value) + '</div>' +
          '<div class="pr-kpi-label">' + escHtml(k.label) + '</div>' +
        '</div>'
      );
    }).join("");
  }

  function updateTaskBreakdown(c) {
    var legend = document.getElementById(PREFIX + "-d-legend");
    var stacked = document.getElementById(PREFIX + "-d-stacked");
    var caption = document.getElementById(PREFIX + "-d-stacked-caption");
    if (legend) {
      legend.innerHTML =
        '<span class="done">✓ ' + c.done + ' Done</span>' +
        '<span class="ip">◐ ' + c.in_progress + ' In Progress</span>' +
        '<span class="pend">○ ' + c.pending + ' Pending</span>';
    }
    if (stacked) {
      var total = c.total || 1;
      var dPct = Math.round((c.done / total) * 100);
      var iPct = Math.round((c.in_progress / total) * 100);
      stacked.innerHTML =
        '<div class="seg-done" style="width:' + dPct + '%"></div>' +
        '<div class="seg-ip" style="width:' + iPct + '%"></div>';
    }
    if (caption) {
      caption.textContent = c.total
        ? (c.done + " of " + c.total + " total tasks completed")
        : "No tasks yet";
    }
  }

  function renderMetrics(p) {
    var c = taskCounts(currentTasks);
    var m = computeMetricsFromTasks(c);
    renderKpis(p);
    var gaugePct = document.getElementById(PREFIX + "-d-gauge-pct");
    if (gaugePct) gaugePct.textContent = m.progress + "%";
    setGauge(document.getElementById(PREFIX + "-d-gauge"), m.progress, progressColor(m.progress, p.category));
    updateTaskBreakdown(c);
  }

  function updateGridCard(projectId) {
    var p = projectsMap[projectId];
    if (!p || !root) return;
    var card = root.querySelector('.pr-card[data-project-id="' + projectId + '"]');
    if (!card) return;
    var pct = p.progress || 0;
    var cat = p.category || "automation";
    var gauge = card.querySelector(".pr-gauge");
    if (gauge) {
      gauge.setAttribute("data-progress", pct);
      setGauge(gauge, pct, progressColor(pct, cat));
      var textEl = gauge.querySelector(".pr-gauge-text");
      if (textEl) textEl.textContent = pct + "%";
    }
    var pmoEl = card.querySelector(".pr-pmo-score");
    if (pmoEl) {
      pmoEl.textContent = (p.pmo_score || 0) + "%";
      pmoEl.className = "pr-pmo-score " + pmoClass(p.pmo_score || 0);
    }
    var titleEl = card.querySelector(".pr-card-title");
    if (titleEl) titleEl.textContent = p.phase || "—";
    var metaEl = card.querySelector(".pr-card-meta");
    if (metaEl) {

  function openEditProjectModal() {

  window.__ppSubmitCardDemoProjectEdit = function (form, done) {
    var projectId = window.__ppCardEditFallbackId;
    if (!projectId || !projectsMap[projectId]) {
      done(false, "Project not found.");
      return;
    }
    var rs = ppFormFieldValue(form, "register_status") || "on_track";
    var status = rs;
    if (status === "at_risk" || status === "blocked") status = "delayed";
    if (status !== "on_track" && status !== "delayed") status = "on_track";
    var payload = {
      project_id: projectId,
      title: ppFormFieldValue(form, "project_name").trim(),
      description: ppFormFieldValue(form, "objective_sow").trim(),
      business_benefits: ppFormFieldValue(form, "business_benefits").trim(),
      owner: ppFormFieldValue(form, "project_lead").trim(),
      phase: ppFormFieldValue(form, "pmbok_phase") || projectsMap[projectId].phase || "Initiating",
      status: status,
      category: projectsMap[projectId].category || "automation",
    };
    if (IS_MANAGER) {
      payload.deadline = ppFormFieldValue(form, "planned_deadline");
    }
    fetch(UPDATE_PROJECT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCsrf(),
        "X-Requested-With": "XMLHttpRequest",
      },
      body: JSON.stringify(payload),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok || !res.project) {
          done(false, (res && res.message) || "Could not save project.");
          return;
        }
        var prevTasks = cloneTasks(currentTasks);
        projectsMap[projectId] = res.project;
        projectsMap[projectId].tasks = prevTasks;
        currentTasks = prevTasks;
        refreshView();
        done(true);
      })
      .catch(function () { done(false, "Network error — try again."); });

  function updateHeader(p) {

    var countEl = document.getElementById(PREFIX + "-d-task-count");
    var descEl = document.getElementById(PREFIX + "-d-desc");
    if (nameEl) nameEl.textContent = p.title || "—";

    if (countEl) countEl.textContent = n + (n === 1 ? " task" : " tasks");
    if (descEl) {
      descEl.textContent = (p.description || "").trim() || "—";
    }
    var businessBenefits = (p.business_benefits || "").trim() || "—";
    var autoMeta = document.getElementById(PREFIX + "-d-automation-meta");
    var benefitsEl = document.getElementById(PREFIX + "-d-business-benefits");
    if (benefitsEl) benefitsEl.textContent = businessBenefits;
    if (autoMeta) {
      autoMeta.style.display = businessBenefits !== "—" ? "block" : "none";
    }

  function taskAssigneeKey(assignee) {
    return (assignee || "").trim() ? (assignee || "").trim() : TASK_ASSIGNEE_UNASSIGNED;
  }

  function getFilteredTasks() {
    return flattenTasks(currentTasks).filter(function (t) {
      if (taskFilterAssignee !== "all" && taskAssigneeKey(t.assignee) !== taskFilterAssignee) {
        return false;
      }
      return true;
    });
  }

  function populateAssigneeFilter() {
    var sel = document.getElementById(PREFIX + "-filter-assignee");
    if (!sel) return;
    var prev = taskFilterAssignee;
    var seen = {};
    var rows = [];
    flattenTasks(currentTasks).forEach(function (t) {
      var key = taskAssigneeKey(t.assignee);
      if (seen[key]) return;
      seen[key] = true;
      rows.push({
        key: key,
        label: key === TASK_ASSIGNEE_UNASSIGNED ? "Unassigned" : key,
      });
    });
    rows.sort(function (a, b) {
      if (a.key === TASK_ASSIGNEE_UNASSIGNED) return 1;
      if (b.key === TASK_ASSIGNEE_UNASSIGNED) return -1;
      return a.label.localeCompare(b.label);
    });
    var html = '<option value="all">All</option>';
    rows.forEach(function (r) {
      html += '<option value="' + escHtml(r.key) + '">' + escHtml(r.label) + "</option>";
    });
    sel.innerHTML = html;
    if (prev !== "all" && seen[prev]) {
      sel.value = prev;
      taskFilterAssignee = prev;
    } else {
      sel.value = "all";
      taskFilterAssignee = "all";
    }
  }

  function updateTaskFilterHint(total, shown) {
    var hint = document.getElementById(PREFIX + "-task-filter-hint");
    if (!hint) return;
    var active = taskFilterAssignee !== "all";
    if (!total) {
      hint.style.display = "none";
      hint.textContent = "";
      return;
    }
    if (active && shown !== total) {
      hint.style.display = "block";
      hint.textContent = "Showing " + shown + " of " + total + " tasks";
    } else {
      hint.style.display = "none";
      hint.textContent = "";
    }
  }

  function resetTaskFilters() {
    taskFilterAssignee = "all";
    var assigneeSel = document.getElementById(PREFIX + "-filter-assignee");
    if (assigneeSel) assigneeSel.value = "all";
  }

  function renderTasksTable() {
    var tbody = document.getElementById(PREFIX + "-d-table-body");
    if (!tbody) return;
    var allFlat = flattenTasks(currentTasks);
    var flat = getFilteredTasks();
    updateTaskFilterHint(allFlat.length, flat.length);
    if (!allFlat.length) {
      tbody.innerHTML =
        '<tr><td colspan="5" class="tw-reg-empty-msg" style="text-align:center;padding:22px;">' +
        "No tasks yet. Use + Add Task to add work for this project." +
        "</td></tr>";
      return;
    }
    if (!flat.length) {
      tbody.innerHTML =
        '<tr><td colspan="5" class="tw-reg-empty-msg" style="text-align:center;padding:22px;">' +
        "No tasks match the selected filters." +
        "</td></tr>";
      return;
    }
    tbody.innerHTML = flat.map(function (t) {
      var dl = t.deadline_display || t.deadline || "—";
      var st = taskStatusMeta(t.status);
      return (
        '<tr class="pr-task-row-clickable" data-task-id="' + escHtml(t.id) + '">' +
          "<td>" +
            '<div class="pr-task-name">' + escHtml(t.text) + "</div>" +
          "</td>" +
          '<td><span class="pr-task-status-pill ' + st.cls + '">' + escHtml(st.label) + "</span></td>" +
          '<td><span class="tw-pm-name">' + escHtml(dl) + "</span></td>" +
          '<td><span class="tw-pm-name">' + escHtml(t.assignee || "—") + "</span></td>" +
          '<td><div class="pr-task-table-actions">' +
            '<button type="button" class="pr-task-act-btn pr-task-edit" title="Edit">✎</button>' +
            '<button type="button" class="pr-task-act-btn pr-task-del" title="Delete">×</button>' +
          "</div></td>" +
        "</tr>"
      );
    }).join("");
  }

  function phaseNumber(label) {
    var m = String(label || "").match(/phase\s*(\d+)/i);
    return m ? parseInt(m[1], 10) : null;
  }

  function computePhasesFromTasks(tasks, phaseDefs) {
    var countsByNum = {};
    (tasks || []).forEach(function (grp) {
      var num = phaseNumber(grp.phase);
      if (num === null) return;
      var items = grp.items || [];
      if (!countsByNum[num]) countsByNum[num] = { done: 0, total: 0 };
      countsByNum[num].total += items.length;
      countsByNum[num].done += items.filter(function (t) { return t.status === "done"; }).length;
    });
    var defs = phaseDefs && phaseDefs.length ? phaseDefs : [];
    if (!defs.length) {
      DEFAULT_PHASES.forEach(function (ph, i) {
        defs.push({ name: "Phase " + (i + 1) });
      });
    }
    return defs.map(function (phDef) {
      var name = phDef.name || phDef;
      var num = phaseNumber(name);
      var stats = (num !== null && countsByNum[num]) ? countsByNum[num] : { done: 0, total: 0 };
      var pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
      return { name: name, done: stats.done, total: stats.total, pct: pct };
    });
  }

  function renderPhases(p) {
    var el = document.getElementById(PREFIX + "-d-phases");
    if (!el) return;
    var phases = computePhasesFromTasks(currentTasks, p.phases || []);
    if (!phases.length) {
      el.innerHTML = '<div class="pr-empty-msg">No phase data yet.</div>';
      return;
    }
    el.innerHTML = phases.map(function (ph) {
      var pct = ph.pct || 0;
      var cls = pct >= 100 ? "complete" : (pct > 0 ? "partial" : "");
      var statsLabel = ph.total
        ? (ph.done + "/" + ph.total + " tasks · " + pct + "%")
        : "0 tasks";
      return (
        '<div class="pr-phase-row">' +
          '<div class="pr-phase-header">' +
            '<span class="pr-phase-name">' + escHtml(ph.name) + '</span>' +
            '<span class="pr-phase-stats">' + escHtml(statsLabel) + '</span>' +
          '</div>' +
          '<div class="pr-phase-bar"><div class="pr-phase-bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
        '</div>'
      );
    }).join("");
  }

  function phaseOptions(p) {
    var seen = {};
    var opts = [];
    function add(ph) {
      var key = (ph || "").trim();
      if (!key || seen[key]) return;
      seen[key] = true;
      opts.push(key);
    }
    flattenTasks(currentTasks).forEach(function (t) { add(t.phase); });
    (p.phases || []).forEach(function (ph) { add((ph.name || "").toUpperCase()); });
    DEFAULT_PHASES.forEach(add);
    return opts;
  }

  function populatePhaseSelect(p, selected) {
    var sel = document.getElementById(PREFIX + "-task-phase");
    if (!sel) return;
    var opts = phaseOptions(p);
    sel.innerHTML = opts.map(function (ph) {
      return '<option value="' + escHtml(ph) + '"' + (ph === selected ? ' selected' : '') + '>' + escHtml(ph) + '</option>';
    }).join("");
  }

  function syncProjectFromTasks(p) {
    if (!p) return;
    var c = taskCounts(currentTasks);
    var m = computeMetricsFromTasks(c);
    p.progress = m.progress;
    p.pmo_score = m.pmo_score;
    p.spi = m.spi;
    p.cpi = m.cpi;
    p.tasks_done = c.done;
    p.tasks_total = c.total;
    p.tasks_in_progress = c.in_progress;
    p.tasks_pending = c.pending;
    p.phases = computePhasesFromTasks(currentTasks, p.phases || []);
  }

  function refreshView() {
    var p = projectsMap[currentProjectId];
    if (!p) return;
    syncProjectFromTasks(p);
    updateHeader(p);
    populateAssigneeFilter();
    renderTasksTable();
    renderMetrics(p);
    updateGridCard(currentProjectId);
  }

  function showRegister() {
    if (currentProjectId) updateGridCard(currentProjectId);
    if (registerWrap) registerWrap.style.display = "";
    if (detailView) {
      detailView.classList.remove("pr-detail-visible");

  function showDetail(projectId) {
    var p = projectsMap[projectId];
    if (!p || !detailView) return;

    currentProjectId = projectId;
    var flatInit = flattenTasks(cloneTasks(p.tasks || []));
    flatInit.forEach(function (t) {
      if (!t.id) t.id = "t-" + Math.random().toString(36).slice(2, 9);
    });
    currentTasks = groupTasks(flatInit);

    refreshView();

    if (registerWrap) registerWrap.style.display = "none";

  function saveTasks(cb) {
    if (!currentProjectId) return;
    fetch(SAVE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCsrf(),
        "X-Requested-With": "XMLHttpRequest",
      },
      body: JSON.stringify({ project_id: currentProjectId, tasks: currentTasks }),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok && projectsMap[currentProjectId]) {
          var proj = projectsMap[currentProjectId];
          proj.tasks = cloneTasks(currentTasks);
          if (res.counts) {
            proj.progress = res.counts.progress;
            proj.pmo_score = res.counts.pmo_score;
            proj.spi = res.counts.spi;
            proj.cpi = res.counts.cpi;
            proj.tasks_done = res.counts.tasks_done;
            proj.tasks_total = res.counts.tasks_total;
            proj.tasks_in_progress = res.counts.tasks_in_progress;
            proj.tasks_pending = res.counts.tasks_pending;
          } else {
            syncProjectFromTasks(proj);
          }
          updateGridCard(currentProjectId);
        }
        if (typeof cb === "function") cb(res);
      })
      .catch(function () { if (typeof cb === "function") cb({ ok: false }); });
  }

  function findTask(taskId) {
    var found = null;
    currentTasks.forEach(function (grp) {
      (grp.items || []).forEach(function (t) {
        if (t.id === taskId) found = { grp: grp, task: t };
      });
    });
    return found;
  }

  function ppFormFieldValue(form, name) {
    if (!form || !name) return "";
    var el = form.elements.namedItem(name);
    if (!el) return "";
    return String(el.value || "");
  }

  function normalizeTaskStatus(status) {
    var st = (status || "pending").trim();
    if (st === "done" || st === "in_progress") return st;
    return "pending";
  }

  function collectTasksFromPpRegisterForm(form) {
    var lead = ppFormFieldValue(form, "project_lead");
    var dl = ppFormFieldValue(form, "planned_deadline");
    var status = normalizeTaskStatus(ppFormFieldValue(form, "task_status"));
    var benefits = ppFormFieldValue(form, "business_benefits").trim();
    var rows = [];
    var name = ppFormFieldValue(form, "project_name").trim();
    if (name) {
      rows.push({
        description: name,
        deadline: dl,
        owner: lead.trim(),
        assignee: lead.trim(),
        status: status,
        business_benefits: benefits,
      });
    }
    var procDesc = form.querySelectorAll('[name="process_description"]');
    var procDl = form.querySelectorAll('[name="process_deadline"]');
    var procOwn = form.querySelectorAll('[name="process_owner"]');
    procDesc.forEach(function (inp, idx) {
      var desc = (inp.value || "").trim();
      if (!desc) return;
      if (name && desc === name && rows.length === 1) return;
      rows.push({
        description: desc,
        deadline: (procDl[idx] && procDl[idx].value) || dl,
        owner: ((procOwn[idx] && procOwn[idx].value) || lead).trim(),
        assignee: ((procOwn[idx] && procOwn[idx].value) || lead).trim(),
        status: status,
        business_benefits: benefits,
      });
    });
    return rows;
  }

  function showPpTaskFormError(msg) {
    var err = document.getElementById("ppAddProjectError");
    if (!err) return;
    if (msg) {
      err.textContent = msg;
      err.classList.remove("d-none");
    } else {
      err.textContent = "";
      err.classList.add("d-none");
    }
  }

  function closeTaskModal() {
    var modalEl = document.getElementById("ppAddProjectModal");
    if (modalEl && window.bootstrap && bootstrap.Modal) {
      var m = bootstrap.Modal.getInstance(modalEl);
      if (m) m.hide();

    editingTaskId = null;

  function openTaskModal(editTask) {
    if (!projectsMap[currentProjectId]) return;
    if (typeof window.__ppOpenRegisterNewTask !== "function") return;
    editingTaskId = editTask ? editTask.id : null;
    window.__ppOpenRegisterNewTask({
      projectId: currentProjectId,
      editTask: editTask || null,
    });

  root.__prOpenDetail = showDetail;
  window.__prOpenProjectDetail = showDetail;

  document.getElementById(PREFIX + "-back-btn").addEventListener("click", showRegister);
  document.getElementById(PREFIX + "-edit-project-btn").addEventListener("click", openEditProjectModal);
  var filterAssigneeEl = document.getElementById(PREFIX + "-filter-assignee");
  if (filterAssigneeEl) {
    filterAssigneeEl.addEventListener("change", function () {

      renderTasksTable();

  function applyServerTaskPayload(res) {
    if (!res || !res.ok || !projectsMap[currentProjectId]) return false;
    var proj = projectsMap[currentProjectId];
    currentTasks = cloneTasks(res.tasks || []);
    proj.tasks = cloneTasks(res.tasks || []);
    if (res.counts) {
      proj.progress = res.counts.progress;
      proj.pmo_score = res.counts.pmo_score;
      proj.spi = res.counts.spi;
      proj.cpi = res.counts.cpi;
      proj.tasks_done = res.counts.tasks_done;
      proj.tasks_total = res.counts.tasks_total;
      proj.tasks_in_progress = res.counts.tasks_in_progress;
      proj.tasks_pending = res.counts.tasks_pending;
    } else {
      syncProjectFromTasks(proj);
    }
    refreshView();
    return true;
  }

  function persistTask(payload, cb, opts) {
    opts = opts || {};
    var p = projectsMap[currentProjectId];
    if (!p) return;
    if (p.tracker_id) {
      payload.tracker_id = p.tracker_id;
      fetch(SAVE_TASK_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCsrf(),
          "X-Requested-With": "XMLHttpRequest",
        },
        body: JSON.stringify(payload),
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) {
            showPpTaskFormError(res.message || "Could not save task.");
            if (typeof cb === "function") cb(res);
            return;
          }
          applyServerTaskPayload(res);
          if (!opts.suppressClose) closeTaskModal();
          if (typeof cb === "function") cb(res);
        })
        .catch(function () {
          showPpTaskFormError("Network error — try again.");
          if (typeof cb === "function") cb({ ok: false });
        });
      return;
    }
    var text = payload.description || "";
    var assignee = payload.owner || payload.assignee || "";
    var deadline = payload.deadline || "";
    var status = payload.status || "pending";
    var benefits = payload.business_benefits || "";
    if (payload.delete) {
      currentTasks = groupTasks(
        flattenTasks(currentTasks).filter(function (t) { return String(t.id) !== String(payload.step_id); })
      );
    } else if (payload.step_id) {
      var flatEdit = flattenTasks(currentTasks);
      flatEdit.forEach(function (t) {
        if (String(t.id) === String(payload.step_id)) {
          t.text = text;
          t.assignee = assignee;
          t.status = status;
          t.deadline = deadline;
          t.deadline_display = deadline;
          t.business_benefits = benefits;
        }
      });
      currentTasks = groupTasks(flatEdit);
    } else {
      currentTasks = groupTasks(flattenTasks(currentTasks).concat([{
        id: "t-" + Math.random().toString(36).slice(2, 9),
        text: text,
        status: status,
        assignee: assignee,
        deadline: deadline,
        deadline_display: deadline,
        business_benefits: benefits,
        phase: "PROJECT TASKS",
      }]));
    }
    refreshView();
    if (!opts.suppressClose) closeTaskModal();
    saveTasks(cb);
  }

  function persistTaskRowsSequential(rows, idx, cb) {
    if (!rows.length) {
      showPpTaskFormError("Description is required.");
      return;
    }
    if (idx >= rows.length) {
      if (typeof cb === "function") cb({ ok: true });
      return;
    }
    var row = rows[idx];
    var payload = {
      description: row.description,
      deadline: row.deadline,
      owner: row.owner,
      status: row.status,
      business_benefits: row.business_benefits || "",
    };
    if (editingTaskId && idx === 0) payload.step_id = editingTaskId;
    var suppressClose = idx < rows.length - 1;
    persistTask(payload, function (res) {
      if (!res || !res.ok) {
        if (typeof cb === "function") cb(res || { ok: false });
        return;
      }
      persistTaskRowsSequential(rows, idx + 1, cb);
    }, { suppressClose: suppressClose });
  }

  window.__ppSubmitTaskFromRegisterForm = function (form, done) {
    var ctx = window.__ppTaskContext || {};
    if (ctx.projectId) currentProjectId = ctx.projectId;
    if (!currentProjectId || !projectsMap[currentProjectId]) {
      done(false, "Project not found.");
      return;
    }

    var rows = collectTasksFromPpRegisterForm(form);
    if (!rows.length) {
      done(false, "Description is required.");
      return;
    }

    editingTaskId = ctx.editTask && ctx.editTask.id ? ctx.editTask.id : null;

    if (editingTaskId) {
      var editPayload = rows[0];
      editPayload.step_id = editingTaskId;
      persistTask(editPayload, function (res) {
        done(!!(res && res.ok), res && !res.ok ? (res.message || "Could not save task.") : "");
      });
      return;
    }

    if (rows.length === 1) {
      persistTask(rows[0], function (res) {
        done(!!(res && res.ok), res && !res.ok ? (res.message || "Could not save task.") : "");
      });
      return;
    }

    var p = projectsMap[currentProjectId];
    if (p && p.tracker_id) {
      persistTaskRowsSequential(rows, 0, function (res) {
        done(!!(res && res.ok), res && !res.ok ? (res.message || "Could not save task.") : "");
      });
      return;
    }

    var newItems = rows.map(function (row) {
      return {
        id: "t-" + Math.random().toString(36).slice(2, 9),
        text: row.description,
        status: row.status || "pending",
        assignee: row.assignee || "",
        deadline: row.deadline || "",
        deadline_display: row.deadline || "",
        business_benefits: row.business_benefits || "",
        phase: "PROJECT TASKS",
      };
    });
    currentTasks = groupTasks(flattenTasks(currentTasks).concat(newItems));
    refreshView();
    closeTaskModal();
    saveTasks(function (res) {
      done(!!(res && res.ok !== false));
    });
  };

  document.getElementById(PREFIX + "-d-table-body").addEventListener("click", function (e) {
    if (e.target.closest(".pr-task-edit") || e.target.closest(".pr-task-del")) {
      e.stopPropagation();
    }
    var row = e.target.closest("tr[data-task-id]");
    if (!row) return;
    var taskId = row.getAttribute("data-task-id");

    if (e.target.closest(".pr-task-del")) {
      persistTask({ step_id: taskId, delete: true });
      return;
    }
    if (e.target.closest(".pr-task-edit") || !e.target.closest(".pr-task-table-actions")) {
      var hit = findTask(taskId);
      if (hit) {
        openTaskModal({
          id: hit.task.id,
          text: hit.task.text,
          status: hit.task.status,
          assignee: hit.task.assignee,
          deadline: hit.task.deadline || "",

        });

  });
